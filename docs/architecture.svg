<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">PyVDisk Agentic architecture</title><desc id="desc">Agent application connects to ExecutionService, queue, run state, capabilities and unified DataDisk namespaces.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#0f172a}.box{stroke:#334155;stroke-width:2;rx:12}.label{font-size:18px;font-weight:700}.small{font-size:14px}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1100" height="620" fill="#f8fafc"/><text x="550" y="38" text-anchor="middle" font-size="26" font-weight="700">PyVDisk Agentic 数据与执行架构</text>
<rect class="box" x="430" y="65" width="240" height="58" fill="#dbeafe"/><text class="label" x="550" y="100" text-anchor="middle">Agent / 应用</text>
<rect class="box" x="390" y="155" width="320" height="68" fill="#e0e7ff"/><text class="label" x="550" y="185" text-anchor="middle">ExecutionService</text><text class="small" x="550" y="207" text-anchor="middle">inline / 可选 worker</text>
<path class="arrow" d="M550 123 V155"/>
<rect class="box" x="70" y="270" width="220" height="75" fill="#fef3c7"/><text class="label" x="180" y="300" text-anchor="middle">DurableQueue</text><text class="small" x="180" y="323" text-anchor="middle">lease · retry · DLQ</text>
<rect class="box" x="330" y="270" width="220" height="75" fill="#fef3c7"/><text class="label" x="440" y="300" text-anchor="middle">RunStateStore</text><text class="small" x="440" y="323" text-anchor="middle">状态 · 结果 · 审计</text>
<rect class="box" x="590" y="270" width="220" height="75" fill="#dcfce7"/><text class="label" x="700" y="300" text-anchor="middle">ScopedDataDisk</text><text class="small" x="700" y="323" text-anchor="middle">capability boundary</text>
<path class="arrow" d="M480 223 L180 270"/><path class="arrow" d="M550 223 V270"/><path class="arrow" d="M620 223 L700 270"/>
<rect class="box" x="250" y="395" width="600" height="70" fill="#bfdbfe"/><text class="label" x="550" y="425" text-anchor="middle">DataDisk · 单一 .vdisk 容器</text><text class="small" x="550" y="447" text-anchor="middle">统一存储、事务协调与恢复边界</text><path class="arrow" d="M700 345 V395"/><path class="arrow" d="M440 345 V395"/>
<g><rect class="box" x="50" y="515" width="150" height="65" fill="#f1f5f9"/><text class="label" x="125" y="543" text-anchor="middle">FS</text><text class="small" x="125" y="563" text-anchor="middle">workspace</text><rect class="box" x="225" y="515" width="150" height="65" fill="#f1f5f9"/><text class="label" x="300" y="543" text-anchor="middle">Vector</text><text class="small" x="300" y="563" text-anchor="middle">HNSW memory</text><rect class="box" x="400" y="515" width="150" height="65" fill="#f1f5f9"/><text class="label" x="475" y="543" text-anchor="middle">Log</text><text class="small" x="475" y="563" text-anchor="middle">trace / replay</text><rect class="box" x="575" y="515" width="150" height="65" fill="#f1f5f9"/><text class="label" x="650" y="543" text-anchor="middle">Checkpoint</text><text class="small" x="650" y="563" text-anchor="middle">WAL / recovery</text><rect class="box" x="750" y="515" width="150" height="65" fill="#f1f5f9"/><text class="label" x="825" y="543" text-anchor="middle">Volume</text><text class="small" x="825" y="563" text-anchor="middle">block / mirror</text></g><path class="arrow" d="M330 465 L125 515"/><path class="arrow" d="M430 465 L300 515"/><path class="arrow" d="M520 465 L475 515"/><path class="arrow" d="M620 465 L650 515"/><path class="arrow" d="M720 465 L825 515"/>
</svg>
