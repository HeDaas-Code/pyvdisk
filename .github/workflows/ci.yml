name: CI
on:
  push: {}
  pull_request: {}
jobs:
  tests:
    runs-on: ubuntu-latest
    # hnswlib builds from source here; without a cap a stuck build burns the runner.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every version requires-python promises. The 3.9 job is the floor: it is what
        # fails if a change starts using newer syntax (it caught PEP 701 nesting).
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # [vector] keeps the hnswlib path covered now that it is optional: without
          # this the accelerator backend would silently stop being tested.
          python -m pip install -e .[dev,vector]
      - name: Tests
        run: python -m pytest -q --no-header -p no:cacheprovider

  no-dependencies:
    # The zero-dependency claim is a promise to users, so it gets its own job: install
    # the package alone and prove the core still imports and passes.  The matrix is
    # where Windows gets covered (#7): every platform primitive the package touches
    # lives in pyvdisk/compat.py, and the emulation tests force those paths on Linux,
    # but only a real Windows runner exercises msvcrt.locking, the directory-fsync
    # no-op and drive-letter paths against the actual OS.  PR #5 proved the port
    # works; this job keeps proving it on every push.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install without extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: No third-party runtime dependency may be installed
        run: |
          python -c "import importlib.util,sys; bad=[n for n in ('hnswlib','fuse','numpy') if importlib.util.find_spec(n)]; sys.exit('installed: '+','.join(bad)) if bad else None"
          python -c "import pyvdisk; print('pyvdisk', pyvdisk.__version__, 'imported with the standard library only')"
      - name: Tests (accelerator-dependent cases skip)
        run: python -m pytest -q --no-header -p no:cacheprovider
      - name: Quickstart smoke (stdlib only, end to end)
        run: python examples/quickstart.py
